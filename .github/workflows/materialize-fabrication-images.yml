name: Materialize fabrication images

on:
  push:
    branches: [main]
    paths:
      - 'assets/images/process-thumb-base64.txt'
      - 'assets/images/reflection-thumb-base64.txt'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode image assets
        shell: bash
        run: |
          set -euo pipefail
          base64 -d assets/images/process-thumb-base64.txt > assets/images/minerva-beta-process.webp
          base64 -d assets/images/reflection-thumb-base64.txt > assets/images/minerva-beta-reflection.webp
          rm -f assets/images/process-thumb-base64.txt assets/images/reflection-thumb-base64.txt
          rm -f assets/images/minerva-beta-process.jpeg assets/images/minerva-beta-reflection.jpeg
      - name: Refine fabrication gallery placement
        shell: bash
        run: |
          cat > assets/css/enhancements.css <<'CSS'
          @import url("enhancements-base.css");

          /* Object & Creative Fabrication: supporting studies sit high beneath the copy; finished work remains dominant. */
          .work-card:nth-child(4)::before,
          .work-card:nth-child(4)::after {
            content: "";
            display: block;
            border: 2px solid var(--ink, #171413);
            background-color: #e8dfd3;
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            box-shadow: .38rem .38rem 0 rgba(23, 20, 19, .18);
          }

          .work-card:nth-child(4)::before { background-image: url("../images/minerva-beta-process.webp"); }
          .work-card:nth-child(4)::after { background-image: url("../images/minerva-beta-reflection.webp"); }

          @media (min-width: 901px) {
            .work-card:nth-child(4) {
              grid-template-columns: minmax(17rem, .82fr) minmax(0, 1.18fr);
              grid-template-rows: auto auto auto;
              gap: .9rem clamp(1.8rem, 3vw, 2.8rem);
              align-items: start;
            }
            .work-card:nth-child(4) .work-meta {
              grid-column: 1;
              grid-row: 1;
              padding-top: 0;
            }
            .work-card:nth-child(4)::before {
              grid-column: 1;
              grid-row: 2;
              min-height: 15rem;
              margin-top: .2rem;
            }
            .work-card:nth-child(4)::after {
              grid-column: 1;
              grid-row: 3;
              min-height: 13.5rem;
              margin-top: .35rem;
            }
            .work-card:nth-child(4) .art-figure {
              grid-column: 2;
              grid-row: 1 / span 3;
              align-self: start;
            }
            .work-card:nth-child(4) .art-frame {
              height: auto;
              min-height: 0;
            }
          }

          @media (max-width: 900px) {
            .work-card:nth-child(4) {
              display: grid;
              grid-template-columns: 1fr;
              gap: 1.1rem;
            }
            .work-card:nth-child(4) .work-meta { order: 1; padding-top: .35rem; }
            .work-card:nth-child(4)::before { order: 2; min-height: clamp(18rem, 92vw, 32rem); }
            .work-card:nth-child(4)::after { order: 3; min-height: clamp(17rem, 88vw, 30rem); }
            .work-card:nth-child(4) .art-figure { order: 4; }
          }
          CSS
      - name: Commit generated image assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images assets/css/enhancements.css
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Materialize fabrication gallery images"
          git push
