name: Materialize approved boundary PNG

on:
  push:
    branches:
      - portfolio-hero-png-r2
    paths:
      - '.tmp/boundary/READY'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio-hero-png-r2
      - name: Reconstruct approved PNG and update hero
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/boundary/*.b64 | base64 -d > assets/images/boundary-headline.png
          echo '18ebcae3c871003bdbc778c952f5441d6422126196854f963213d3130ae26fc4  assets/images/boundary-headline.png' | sha256sum -c -
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          html = index.read_text()
          old = '<h1 id="cover-title">The boundary is never just a line.</h1>'
          new = '<h1 id="cover-title" class="hero-thesis-mark"><img src="assets/images/boundary-headline.png" alt="The boundary is never just a line." width="800" height="841" /></h1>'
          if old not in html:
              raise SystemExit('Expected hero heading not found; refusing to patch.')
          index.write_text(html.replace(old, new, 1))

          css = Path('assets/css/styles.css')
          text = css.read_text()
          anchor = 'h1{margin-bottom:1.25rem;max-width:10.8ch;font-size:clamp(4rem,10vw,10rem);line-height:.88;text-shadow:.035em .035em 0 rgba(242,122,22,.15)}\n'
          addition = anchor + '.hero-thesis-mark{max-width:800px;font-size:0;line-height:0;text-shadow:none}\n.hero-thesis-mark img{width:100%;height:auto}\n'
          if anchor not in text:
              raise SystemExit('Expected h1 CSS rule not found; refusing to patch.')
          css.write_text(text.replace(anchor, addition, 1))
          PY
          rm -rf .tmp/boundary
          rm -f .github/workflows/materialize-boundary-png.yml
      - name: Commit materialized asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use approved boundary thesis PNG'
          git push origin HEAD:portfolio-hero-png-r2
